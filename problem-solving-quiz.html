<!DOCTYPE html>
<html lang="ko">
<head>

      --gray-800: #1E293B;
    }
    body {

    }
    nav {

    .nav-logo .badge { background: var(--accent); color: var(--navy); font-size: 0.65rem; font-weight: 900; padding: 2px 7px; border-radius: 20px; }
    .nav-back { color: rgba(255,255,255,0.7); font-size: 0.85rem; text-decoration: none; }

    .wrapper { max-width: 520px; margin: 0 auto; padding: 32px 20px 60px; }

    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    #screen-intro { text-align:center; animation: fadeIn 0.5s ease; }
    .intro-emoji { font-size:3.6rem; margin-bottom:16px; display:block; animation: float 3s ease-in-out infinite; }
    .intro-tag { display:inline-block; background:var(--accent); color:var(--navy); font-size:0.7rem; font-weight:900; letter-spacing:0.1em; padding:4px 14px; border-radius:20px; margin-bottom:14px; }
    .intro-title { font-size:clamp(1.5rem,5vw,2.1rem); font-weight:900; color:var(--navy); line-height:1.3; margin-bottom:10px; }
    .intro-title span { color:var(--accent); }
    .intro-desc { font-size:0.9rem; color:var(--gray-500); line-height:1.8; margin-bottom:24px; }
    .intro-meta { display:flex; justify-content:center; gap:12px; margin-bottom:26px; flex-wrap:wrap; }
    .meta-box { background:var(--white); border-radius:12px; padding:12px 18px; }
    .meta-val { font-size:1.2rem; font-weight:900; color:var(--navy); display:block; }
    .meta-lbl { font-size:0.68rem; color:var(--gray-500); }
    .btn-start {

    .progress-label { display:flex; justify-content:space-between; font-size:0.78rem; color:var(--gray-500); margin-bottom:8px; }
    .progress-bar { height:5px; background:var(--gray-200); border-radius:3px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--navy),var(--navy-light)); border-radius:3px; transition:width 0.4s ease; }

    .q-card {

      box-shadow:0 4px 24px rgba(11,37,89,0.1); margin-bottom:18px;
      animation: slideUp 0.35s ease;

    .q-situation {

      background:var(--gray-100); border-radius:20px;
      padding:6px 14px; font-size:0.78rem; color:var(--gray-500);
      margin-bottom:16px;
    }
    .q-text { font-size:1.08rem; font-weight:700; color:var(--navy); line-height:1.6; }

    .options { display:flex; flex-direction:column; gap:10px; }
    .opt-btn {
      background:var(--white); border:2px solid var(--gray-200);
      border-radius:14px; padding:15px 18px;
      font-size:0.9rem; font-weight:500; color:var(--gray-800);

    }

    .opt-btn:disabled { cursor:default; opacity:0.5; }
    .opt-btn.selected { border-color:var(--navy); background:var(--navy); color:var(--white); opacity:1; }
    .opt-num {
      flex-shrink:0; width:22px; height:22px; border-radius:50%;
      background:var(--gray-100); color:var(--gray-500);
      display:flex; align-items:center; justify-content:center;
      font-size:0.72rem; font-weight:700;
    }
    .opt-btn.selected .opt-num { background:var(--accent); color:var(--navy); }

    /* RESULT */
    #screen-result { display:none; animation: fadeIn 0.5s ease; }
    .result-card {
      background:var(--white); border-radius:24px; overflow:hidden;
      box-shadow:0 8px 40px rgba(11,37,89,0.12); margin-bottom:24px;
    }
    .result-header {
      background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);

    .result-quote {

      padding:14px 18px; border-radius:0 10px 10px 0; margin-bottom:18px; line-height:1.6;

    .result-traits h4 { font-size:0.78rem; font-weight:700; color:var(--navy-light); letter-spacing:0.08em; margin-bottom:12px; }

    .trait-tag { background:var(--gray-100); color:var(--navy); font-size:0.78rem; font-weight:600; padding:5px 12px; border-radius:20px; border:1px solid var(--gray-200); }
    .result-tip {

      padding:14px 16px; font-size:0.85rem; color:#92400E; line-height:1.7;
    }
    .result-actions { display:flex; gap:12px; }
    .btn-retry { flex:1; background:var(--white); color:var(--navy); border:2px solid var(--navy); border-radius:50px; padding:13px 20px; font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-home { flex:1; background:var(--navy); color:var(--white); border:none; border-radius:50px; padding:13px 20px; font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; display:flex; align-items:center; justify-content:center; }

    desc: "혼자보다 함께 풀어가는 것을 선호하는 타입이에요. 다양한 의견을 모아 더 나은 답을 찾고, 팀 전체의 지혜를 활용합니다. 조율과 합의를 이끄는 데 탁월해요.",
    traits: ["소통력", "경청", "조율력", "포용력", "팀워크"],
    tip: "💡 의견을 모으는 데 시간이 오래 걸릴 수 있어요. 때로는 빠른 결단도 필요해요!"
  },
  cautious: {
    emoji: "🛡️", name: "신중형 해결사", badge: "CAUTIOUS",
    quote: "우리는 작은 유혹 앞에서도 언제나 원칙을 선택합니다.",
    desc: "리스크를 꼼꼼히 따지고 안정적으로 접근하는 타입이에요. 성급한 결정보다 확실한 검증을 선호하며, 실수를 최소화합니다. 안정감 있는 결과를 만들어내는 존재예요.",
    traits: ["신중함", "리스크 관리", "꼼꼼함", "안정성", "체계성"],
    tip: "💡 너무 신중하면 기회를 놓칠 수 있어요. 확신이 서면 과감하게 실행해보세요!"
  },
  root: {
    emoji: "🔍", name: "근본해결형 해결사", badge: "ROOT CAUSE",
    quote: "\"원래 이렇게 해왔으니까\" 대신 근거 기반으로 재검토합니다.",
    desc: "표면적인 증상이 아닌 근본 원인을 파고드는 타입이에요. 임시방편을 싫어하고, 같은 문제가 반복되지 않도록 뿌리부터 해결합니다. 장기적으로 조직을 단단하게 만드는 존재예요.",
    traits: ["통찰력", "근본 접근", "끈기", "구조적 사고", "재발 방지"],
    tip: "💡 근본 원인을 찾는 데 시간이 걸릴 수 있어요. 급할 땐 임시 조치도 필요하다는 걸 기억하세요!"
  }
};

let currentQ = 0;
let scores = { analytic:0, creative:0, fast:0, collab:0, cautious:0, root:0 };

function startQuiz() {
  currentQ = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;
  const pct = Math.round((currentQ / total) * 100);

  document.getElementById('progress-text').textContent = `${currentQ + 1} / ${total}`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-situation').textContent = q.situation;
  document.getElementById('q-text').textContent = q.text;

  // 카드 애니메이션 재시작
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';

  const container = document.getElementById('options-container');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-num">${i+1}</span>${opt.text}`;
    btn.onclick = () => selectOption(opt.type, btn);
    container.appendChild(btn);
  });
}

function selectOption(type, btn) {
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  btn.classList.add('selected');

  scores[type] = (scores[type] || 0) + 1;

  setTimeout(() => {
    currentQ++;
    if (currentQ < QUESTIONS.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 350);
}

function showResult() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';
  window.scrollTo(0, 0);

  const maxScore = Math.max(...Object.values(scores));
  const topTypes = Object.entries(scores).filter(([k,v]) => v === maxScore).map(([k]) => k);
  const topType = topTypes[Math.floor(Math.random() * topTypes.length)];
  const type = TYPES[topType];

  document.getElementById('res-emoji').textContent = type.emoji;
  document.getElementById('res-name').textContent = type.name;
  document.getElementById('res-badge').textContent = type.badge;
  document.getElementById('res-quote').textContent = '"' + type.quote + '"';
  document.getElementById('res-desc').textContent = type.desc;
  document.getElementById('res-traits').innerHTML = type.traits.map(t => `<span class="trait-tag">${t}</span>`).join('');
  document.getElementById('res-tip').textContent = type.tip;
}
</script>

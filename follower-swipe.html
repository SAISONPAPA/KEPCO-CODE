<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>나의 팔로워 유형은? | KEPCO CODE</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0B2559;
      --navy-mid: #1A3A7A;
      --navy-light: #2B52A3;
      --accent: #E8A400;
      --white: #FFFFFF;
      --gray-100: #F4F6FA;
      --gray-200: #E2E8F0;
      --gray-500: #64748B;
      --gray-800: #1E293B;
      --red: #EF4444;
      --green: #22C55E;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--gray-100);
      color: var(--gray-800);
      min-height: 100vh;
      overflow-x: hidden;
    }
    nav {
      background: var(--navy);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%; height: 56px;
    }
    .nav-logo { color: var(--white); font-weight: 700; font-size: 0.95rem; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-logo .badge { background: var(--accent); color: var(--navy); font-size: 0.65rem; font-weight: 900; padding: 2px 7px; border-radius: 20px; }
    .nav-back { color: rgba(255,255,255,0.7); font-size: 0.85rem; text-decoration: none; }

    .wrapper { max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; }

    @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pop { 0%{transform:scale(0.85);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    /* ── INTRO ── */
    #screen-intro { text-align:center; animation: fadeIn 0.5s ease; }
    .intro-emoji { font-size:3.6rem; margin-bottom:16px; display:block; animation: float 3s ease-in-out infinite; }
    .intro-tag { display:inline-block; background:var(--accent); color:var(--navy); font-size:0.7rem; font-weight:900; letter-spacing:0.1em; padding:4px 14px; border-radius:20px; margin-bottom:14px; }
    .intro-title { font-size:clamp(1.5rem,5vw,2.1rem); font-weight:900; color:var(--navy); line-height:1.3; margin-bottom:10px; }
    .intro-title span { color:var(--accent); }
    .intro-desc { font-size:0.9rem; color:var(--gray-500); line-height:1.8; margin-bottom:24px; }
    .intro-guide {
      background:var(--white); border-radius:16px; padding:20px;
      margin-bottom:28px; display:flex; justify-content:center; gap:24px;
    }
    .guide-item { text-align:center; }
    .guide-icon { font-size:1.6rem; margin-bottom:6px; display:block; }
    .guide-label { font-size:0.72rem; color:var(--gray-500); font-weight:600; }
    .btn-start {
      background:var(--navy); color:var(--white);
      font-size:1rem; font-weight:700; padding:16px 44px; border-radius:50px;
      border:none; cursor:pointer; font-family:inherit;
      box-shadow:0 4px 20px rgba(11,37,89,0.25);
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .btn-start:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(11,37,89,0.3); }

    /* ── SWIPE ── */
    #screen-swipe { display:none; }
    .progress-wrap { margin-bottom:24px; }
    .progress-label { display:flex; justify-content:space-between; font-size:0.78rem; color:var(--gray-500); margin-bottom:8px; }
    .progress-bar { height:5px; background:var(--gray-200); border-radius:3px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--navy),var(--navy-light)); border-radius:3px; transition:width 0.4s ease; }

    .card-stage {
      position: relative; height: 320px; margin-bottom: 20px;
    }
    .swipe-card {
      position:absolute; inset:0;
      background:var(--white); border-radius:22px;
      box-shadow:0 8px 32px rgba(11,37,89,0.14);
      padding:28px 22px; display:flex; flex-direction:column;
      cursor:grab; touch-action:none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .swipe-card.dragging { transition:none; cursor:grabbing; }
    .swipe-card.exit-left  { transform: translateX(-140%) rotate(-20deg) !important; opacity:0; }
    .swipe-card.exit-right { transform: translateX(140%) rotate(20deg) !important; opacity:0; }

    .card-situation {
      display:inline-flex; align-items:center; gap:6px;
      background:var(--gray-100); border-radius:20px;
      padding:6px 14px; font-size:0.78rem; color:var(--gray-500);
      margin-bottom:20px; align-self:flex-start;
    }
    .card-text { font-size:1.15rem; font-weight:700; color:var(--navy); line-height:1.6; margin-bottom:20px; }

    /* 카드 내 반반 선택 영역 */
    .card-choices {
      display:flex; gap:10px; margin-top:auto;
    }
    .choice-half {
      flex:1; border-radius:14px; padding:16px 12px;
      display:flex; align-items:center; justify-content:center;
      text-align:center; font-size:0.86rem; font-weight:700;
      line-height:1.5; cursor:pointer; transition:all 0.15s;
      min-height:88px;
    }
    .choice-left  { background:var(--navy); color:var(--white); border:2px solid var(--navy); }
    .choice-right { background:var(--accent); color:var(--navy); border:2px solid var(--accent); }
    .choice-half:hover { transform: scale(0.98); }
    .choice-half:active { transform: scale(0.94); }

    /* 드래그 오버레이 스탬프 */
    .stamp {
      position:absolute; top:32px; padding:8px 20px;
      border:4px solid; border-radius:10px;
      font-size:1.3rem; font-weight:900;
      transform:rotate(-15deg); opacity:0;
      pointer-events:none;
    }
    .stamp-left  { left:24px; color:var(--navy); border-color:var(--navy); }
    .stamp-right { right:24px; color:var(--accent); border-color:var(--accent); transform:rotate(15deg); }

    /* ── RESULT ── */
    #screen-result { display:none; animation: fadeIn 0.5s ease; }
    .result-card {
      background:var(--white); border-radius:24px; overflow:hidden;
      box-shadow:0 8px 40px rgba(11,37,89,0.12); margin-bottom:24px;
    }
    .result-header {
      background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
      padding:40px 28px 30px; text-align:center; color:var(--white);
    }
    .result-emoji { font-size:4rem; display:block; margin-bottom:14px; animation:pop 0.5s ease; }
    .result-label { font-size:0.7rem; font-weight:700; letter-spacing:0.12em; color:var(--accent); margin-bottom:8px; }
    .result-name { font-size:1.6rem; font-weight:900; margin-bottom:6px; }
    .result-badge { display:inline-block; background:var(--accent); color:var(--navy); font-size:0.72rem; font-weight:900; padding:4px 14px; border-radius:20px; }
    .result-body { padding:26px 28px; }
    .result-quote {
      font-size:0.95rem; font-weight:700; color:var(--navy);
      background:var(--gray-100); border-left:4px solid var(--accent);
      padding:14px 18px; border-radius:0 10px 10px 0; margin-bottom:18px; line-height:1.6;
    }
    .result-desc { font-size:0.9rem; color:var(--gray-500); line-height:1.85; margin-bottom:22px; }
    .result-traits h4 { font-size:0.78rem; font-weight:700; color:var(--navy-light); letter-spacing:0.08em; margin-bottom:12px; }
    .trait-list { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
    .trait-tag { background:var(--gray-100); color:var(--navy); font-size:0.78rem; font-weight:600; padding:5px 12px; border-radius:20px; border:1px solid var(--gray-200); }
    .result-match {
      background:#FFFBF0; border:1px solid #FDE68A; border-radius:14px;
      padding:16px 18px; display:flex; align-items:center; gap:14px;
    }
    .result-match .match-emoji { font-size:2rem; flex-shrink:0; }
    .result-match .match-text { font-size:0.82rem; color:#92400E; line-height:1.6; }
    .result-match .match-text strong { display:block; font-size:0.95rem; color:var(--navy); margin-bottom:2px; }
    .result-actions { display:flex; gap:12px; }
    .btn-retry { flex:1; background:var(--white); color:var(--navy); border:2px solid var(--navy); border-radius:50px; padding:13px 20px; font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-home { flex:1; background:var(--navy); color:var(--white); border:none; border-radius:50px; padding:13px 20px; font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; display:flex; align-items:center; justify-content:center; }
  </style>
</head>

    emoji: "⚡", name: "활력형 팔로워", badge: "ENERGIZER",
    quote: "우리는 서로를 배려하며 즐거운 업무분위기를 만듭니다.",
    desc: "팀의 분위기를 밝게 만드는 에너지 발전소예요. 어색한 침묵도, 지친 분위기도 특유의 긍정 에너지로 풀어냅니다. 당신이 있는 곳엔 활력이 넘쳐요.",
    traits: ["긍정성", "친화력", "분위기 메이킹", "적극성", "유머"],
    matchLeader: "coach", matchLabel: "코칭형 리더"
  }
};

const LEADER_INFO = {
  direct:  { emoji: "🚀", name: "추진형 리더" },
  vision:  { emoji: "🔭", name: "비전형 리더" },
  system:  { emoji: "⚙️", name: "시스템형 리더" },
  empathy: { emoji: "💬", name: "공감형 리더" },
  support: { emoji: "🤝", name: "지원형 리더" },
  coach:   { emoji: "🌱", name: "코칭형 리더" }
};

let currentQ = 0;
let scores = { coach:0, direct:0, support:0, vision:0, empathy:0, system:0 };
let startX = 0, currentX = 0, isDragging = false;

function startQuiz() {
  currentQ = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-swipe').style.display = 'block';
  renderCard();
}

function renderCard() {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;
  const pct = Math.round((currentQ / total) * 100);

  document.getElementById('progress-text').textContent = `${currentQ + 1} / ${total}`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const stage = document.getElementById('card-stage');
  stage.innerHTML = `
    <div class="swipe-card" id="active-card">
      <div class="stamp stamp-left" id="stamp-left">LEFT</div>
      <div class="stamp stamp-right" id="stamp-right">RIGHT</div>
      <div class="card-situation">${q.situation}</div>
      <div class="card-text">${q.text}</div>
      <div class="card-choices">
        <div class="choice-half choice-left" onclick="chooseOption('left')">${q.left.text}</div>
        <div class="choice-half choice-right" onclick="chooseOption('right')">${q.right.text}</div>
      </div>
    </div>`;

  attachDragEvents();
}

function attachDragEvents() {
  const card = document.getElementById('active-card');
  if (!card) return;

  card.addEventListener('mousedown', dragStart);
  card.addEventListener('touchstart', dragStart, { passive: true });
  document.addEventListener('mousemove', dragMove);
  document.addEventListener('touchmove', dragMove, { passive: true });
  document.addEventListener('mouseup', dragEnd);
  document.addEventListener('touchend', dragEnd);

  function dragStart(e) {
    if (e.target.closest('.choice-half')) return; // 버튼 클릭은 드래그 제외
    isDragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    card.classList.add('dragging');
  }
  function dragMove(e) {
    if (!isDragging) return;
    currentX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    const rotate = currentX * 0.06;
    card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

    const leftStamp = document.getElementById('stamp-left');
    const rightStamp = document.getElementById('stamp-right');
    if (currentX < -20) {
      leftStamp.style.opacity = Math.min(Math.abs(currentX) / 100, 1);
      rightStamp.style.opacity = 0;
    } else if (currentX > 20) {
      rightStamp.style.opacity = Math.min(currentX / 100, 1);
      leftStamp.style.opacity = 0;
    } else {
      leftStamp.style.opacity = 0;
      rightStamp.style.opacity = 0;
    }
  }
  function dragEnd() {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove('dragging');

    if (currentX < -80) {
      chooseOption('left');
    } else if (currentX > 80) {
      chooseOption('right');
    } else {
      card.style.transform = '';
      document.getElementById('stamp-left').style.opacity = 0;
      document.getElementById('stamp-right').style.opacity = 0;
    }
    currentX = 0;
  }
}

function chooseOption(side) {
  const q = QUESTIONS[currentQ];
  const choice = side === 'left' ? q.left : q.right;
  scores[choice.type] = (scores[choice.type] || 0) + 1;

  const card = document.getElementById('active-card');
  if (card) {
    card.classList.add(side === 'left' ? 'exit-left' : 'exit-right');
  }

  setTimeout(() => {
    currentQ++;
    if (currentQ < QUESTIONS.length) {
      renderCard();
    } else {
      showResult();
    }
  }, 280);
}

function showResult() {
  document.getElementById('screen-swipe').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';
  window.scrollTo(0, 0);

  const maxScore = Math.max(...Object.values(scores));
  const topTypes = Object.entries(scores).filter(([k,v]) => v === maxScore).map(([k]) => k);
  const topType = topTypes[Math.floor(Math.random() * topTypes.length)];
  const type = TYPES[topType];

  document.getElementById('res-emoji').textContent = type.emoji;
  document.getElementById('res-name').textContent = type.name;
  document.getElementById('res-badge').textContent = type.badge;
  document.getElementById('res-quote').textContent = '"' + type.quote + '"';
  document.getElementById('res-desc').textContent = type.desc;
  document.getElementById('res-traits').innerHTML = type.traits.map(t => `<span class="trait-tag">${t}</span>`).join('');

  const leader = LEADER_INFO[type.matchLeader];
  document.getElementById('res-match').innerHTML = `
    <span class="match-emoji">${leader.emoji}</span>
    <span class="match-text"><strong>${leader.name}</strong>과(와) 찰떡궁합! 함께 일하면 시너지가 폭발해요 🎯</span>`;
}
</script>
</body>
</html>
